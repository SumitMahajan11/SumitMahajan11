name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: SumitMahajan11
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#22c55e&color_dots=#07130d,#0b2e1b,#14532d,#22c55e,#86efac
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22c55e&color_dots=#050b08,#07130d,#0b2e1b,#16a34a,#86efac

      - name: Push output to snake-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
