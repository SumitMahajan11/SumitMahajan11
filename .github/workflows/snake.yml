name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: SumitMahajan11
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#39D98A&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
            dist/github-contribution-grid-snake-dark.svg?color_snake=#39D98A&color_dots=#0D1117,#0E4429,#006D32,#26A641,#39D353

      - name: Fix generated file permissions
        run: |
          sudo chown -R "$USER:$USER" dist

      - name: Slow snake animation by 20%
        run: |
          sed -i 's/1000ms/1250ms/g' dist/github-contribution-grid-snake.svg
          sed -i 's/1000ms/1250ms/g' dist/github-contribution-grid-snake-dark.svg

      - name: Verify snake files
        run: |
          echo "Generated files:"
          ls -lh dist/

          echo ""
          echo "Animation duration:"
          grep -o "1250ms" dist/github-contribution-grid-snake.svg | head
          grep -o "1250ms" dist/github-contribution-grid-snake-dark.svg | head

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
