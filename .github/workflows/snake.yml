name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: SumitMahajan11
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#22C55E&color_dots=#0D1117,#123524,#166534,#16A34A,#22C55E
            dist/github-contribution-grid-snake-dark.svg?color_snake=#34D399&color_dots=#0D1117,#123524,#166534,#16A34A,#34D399

      - name: Push output to snake-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
